# Publica o servidor (pasta worker/) na Cloudflare.
# Roda sozinho quando algo em worker/ muda no main, ou pelo botão "Run workflow" em Actions.
#
# Segredos do GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  obrigatório: token da Cloudflare (modelo "Edit Cloudflare Workers")
#   ADMIN_KEY             obrigatório: a senha que você vai usar no admin.html
#   GEMINI_API_KEY        opcional: chave do Gemini, se o Worker ainda não tiver uma

name: Publicar servidor

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/publicar-servidor.yml', '.github/scripts/cf-setup.mjs']
  workflow_dispatch:

concurrency: publicar-servidor

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER: npx --yes wrangler@4.20.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar conta e banco KV
        run: node .github/scripts/cf-setup.mjs

      - name: Publicar o código
        working-directory: worker
        run: $WRANGLER deploy

      - name: Configurar segredos
        working-directory: worker
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          existentes=$($WRANGLER secret list 2>/dev/null || echo '[]')
          echo "Segredos que já existem no Worker:"; echo "$existentes" | grep -o '"name": *"[^"]*"' || true

          # TOKEN_SECRET: criado uma única vez (trocar depois desativaria as licenças já ativadas)
          if ! echo "$existentes" | grep -q '"TOKEN_SECRET"'; then
            openssl rand -hex 32 | $WRANGLER secret put TOKEN_SECRET
            echo "TOKEN_SECRET criado."
          fi

          if [ -n "$ADMIN_KEY" ]; then
            printf '%s' "$ADMIN_KEY" | $WRANGLER secret put ADMIN_KEY
          elif ! echo "$existentes" | grep -q '"ADMIN_KEY"'; then
            echo "::warning::Falta o segredo ADMIN_KEY no GitHub. O painel admin não vai funcionar até você cadastrar."
          fi

          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | $WRANGLER secret put GEMINI_API_KEY
          elif ! echo "$existentes" | grep -q '"GEMINI_API_KEY"'; then
            echo "::warning::O Worker não tem GEMINI_API_KEY. A IA não vai funcionar até você cadastrar esse segredo no GitHub."
          fi

      - name: Testar o servidor
        run: |
          sleep 5
          curl -sS --fail "https://proud-sea-aab5.carlosandre-ad1514.workers.dev/health" && echo && echo "Servidor no ar."
