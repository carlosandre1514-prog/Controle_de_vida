<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f0d">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0a0f0d;--card:#121a17;--card2:#18221e;--line:#24332c;--txt:#eef5f0;--mut:#8fa399;--acc:#8ef04a;--acc2:#1d4a1f;--red:#ff6b6b;--blue:#4cc9f0;--purple:#a78bfa;--orange:#ffb347}
[data-theme=light]{--bg:#f3f7f4;--card:#fff;--card2:#eaf1ec;--line:#d5e2d9;--txt:#10201a;--mut:#5d7267;--acc:#2f8f2f;--acc2:#d8f0d2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
#view{padding:16px 16px 24px;max-width:640px;margin:auto}
h1,h2,h3{margin:0}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:600}
.mut{color:var(--mut)}.sm{font-size:13px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#7be03e,#2d8a2d);display:grid;place-items:center;font-weight:800;color:#06210a}
.top .t{flex:1}.top h2{font-size:19px}
.ibtn{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:20px}
.hero{border-radius:28px;padding:22px;background:linear-gradient(135deg,#1a3a1f 0%,#0f1a14 70%);border:1px solid var(--line);margin:18px 0 26px;color:#eef5f0}
[data-theme=light] .hero{background:linear-gradient(135deg,#c9efc0,#eaf6e6);color:#10201a}
.hero .eyebrow{color:var(--acc)}.hero h2{font-size:26px;margin:6px 0}
.ringrow{display:flex;gap:18px;align-items:center;margin-top:18px}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:26px;font-weight:800}
.ring small{display:block;font-size:9px;font-weight:500;color:var(--mut);letter-spacing:.1em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.stat{padding:16px}
.stat .row{display:flex;justify-content:space-between;align-items:center}
.stat .v{font-size:30px;font-weight:800;color:var(--acc);margin:14px 0 2px}
.stat .v small{font-size:14px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--acc);color:#07210b;font-weight:700;font-size:15px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#2a0606}
.btn.sm2{padding:9px;font-size:13px;margin-top:10px}
.tile{border-radius:22px;padding:16px;min-height:120px;border:1px solid var(--line);text-align:left;color:var(--txt);font-size:inherit}
.tile b{display:block;margin-top:10px;font-size:17px}
.tile span{font-size:13px;color:var(--mut)}
.t1{background:linear-gradient(160deg,#1a3a24,#0f1f16)}.t2{background:linear-gradient(160deg,#2c2150,#171229)}
.t3{background:linear-gradient(160deg,#14334a,#0c1b27)}.t4{background:linear-gradient(160deg,#4a2c1a,#26150c)}
.t5{background:linear-gradient(160deg,#143a3a,#0b2020)}.t6{background:linear-gradient(160deg,#3a3a14,#202008)}
[data-theme=light] .tile{background:var(--card)}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dnav .mid{flex:1;text-align:center}.dnav .mid b{display:block;text-transform:capitalize}
.dnav button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:18px}
.dnav input{opacity:0;position:absolute;width:1px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.sum b{display:block;font-size:18px;color:var(--acc)}.sum span{font-size:11px;color:var(--mut)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ch h3{font-size:17px}
.add{border:0;background:var(--acc);color:#07210b;border-radius:12px;padding:8px 14px;font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item .i{flex:1}.item .i b{display:block;font-size:15px}.item .i span{font-size:12px;color:var(--mut)}
.item .x{border:0;background:none;color:var(--red);font-size:18px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{text-decoration:none;display:inline-block;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px}
.chip.on{background:var(--acc);color:#07210b;border-color:var(--acc);font-weight:700}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:100}
#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;max-width:640px;margin:auto}
#modal .sheet h3{margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
#toast.on{opacity:1}
#map{height:300px;border-radius:18px;overflow:hidden;margin-bottom:12px;background:var(--card2)}
.big{font-size:38px;font-weight:800;color:var(--acc);text-align:center}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.mrow div{background:var(--card2);border-radius:14px;padding:10px;text-align:center}
.mrow b{display:block;font-size:17px}.mrow span{font-size:11px;color:var(--mut)}
.chart{width:100%;height:auto}.chart .lb{fill:var(--mut);font-size:10px}
.plan{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;background:var(--card2)}
.plan.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.plan ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--acc);color:#07210b;font-weight:700;margin-left:6px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;margin-right:.3em}
.ibtn .ic,.dnav .ic,.x .ic,.ring .ic{margin:0}
.ibtn .ic{width:22px;height:22px}.x .ic{width:1em;height:1em}
.stat .row>span:first-child .ic{width:26px;height:26px;margin:0;color:var(--acc)}
.tile .ic{width:28px;height:28px;margin:0;color:var(--acc)}
.hero .ic,h1 .ic{color:var(--acc)}
.add .ic,.btn .ic{margin-right:.35em}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:4px}.opts.o3{grid-template-columns:repeat(3,1fr)}
.opt{border:1.5px solid var(--line);background:var(--card2);color:var(--txt);border-radius:16px;padding:12px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:52px;font-family:inherit}
.opt .ic{width:24px;height:24px;margin:0}
.opt.on{border-color:var(--acc);background:var(--acc2);color:var(--acc);font-weight:700}
.opt.yes.on{border-color:#3ddc84;color:#3ddc84}.opt.no.on{border-color:var(--red);color:var(--red);background:#3a1515}
[data-theme=light] .opt.no.on{background:#ffe1e1}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0}
.stepper button{width:52px;height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);color:var(--txt);font-size:26px}
.stepper b{font-size:34px;min-width:50px;text-align:center;color:var(--acc)}
.card[class*=" c-"]{--cc:var(--acc);border-left:4px solid var(--cc);background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 11%,var(--card)),var(--card) 70%)}
.card[class*=" c-"] .ch h3 .ic{color:var(--cc)}
.c-food{--cc:var(--orange)!important}.c-drink,.c-water{--cc:var(--blue)!important}.c-work,.c-act{--cc:var(--acc)!important}
.c-hyg{--cc:#2dd4bf!important}.c-sleep,.c-rest{--cc:var(--purple)!important}.c-weight{--cc:#f0d84a!important}.c-priv{--cc:#ff7aa8!important}
.c-map{--cc:#3b9cff!important}.c-plan{--cc:#ff7a45!important}
.stat[class*=" c-"] .v,.stat[class*=" c-"] .row>span:first-child .ic{color:var(--cc)}
.progbar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}.progbar i{display:block;height:100%;background:var(--acc)}
.shero{border-radius:26px;padding:20px;margin-bottom:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 30%,var(--card)),var(--card) 85%);border:1px solid color-mix(in srgb,var(--cc) 45%,var(--line))}
.shero .hr{display:flex;gap:14px;align-items:center}.shero h1{font-size:24px}
.shero .bi .ic{width:46px;height:46px;margin:0;color:var(--cc)}
.shero .hb{margin-top:14px}.shero .hb b{font-size:38px;color:var(--cc);display:block;line-height:1.05}.shero .hb span{font-size:13px;color:var(--mut)}
.scr .add,.scr .btn:not(.sec):not(.red){background:var(--cc)}
.scr .progbar i{background:var(--cc)}.scr .chip.on{background:var(--cc);border-color:var(--cc)}
.scr .opt.on{border-color:var(--cc);color:var(--cc);background:color-mix(in srgb,var(--cc) 18%,var(--card2))}
.scr .opt.yes.on{border-color:#3ddc84;color:#3ddc84}.scr .opt.no.on{border-color:var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 18%,var(--card2))}
.scr .stepper b{color:var(--cc)}.opts.o3 .opt span{font-size:12px}
.scr.c-hyg .opt{min-height:84px;font-size:15px}
.scr .opt .ic{color:var(--cc)}
.scr .big{color:var(--cc)}
.gl{margin:14px 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .cw{text-align:center;font-size:11px;color:var(--mut);font-weight:700}
.cd{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px;padding:0}
.cd.mk{background:var(--cc);color:#2a0612;font-weight:800;border-color:var(--cc)}
.cd.td{border-color:var(--txt)}.cd.sel{outline:2px solid var(--cc);outline-offset:2px}.cd:disabled{opacity:.3}
.cd i{position:absolute;top:2px;right:4px;font-size:9px;font-style:normal}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.pgrid div div{font-size:11px;color:var(--mut);text-align:center;margin-top:3px}
.ach{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ach.off{opacity:.45}
.ach .ic{width:24px;height:24px;margin:0;color:var(--cc)}
.ach b{display:block;font-size:14px}.ach span{font-size:12px;color:var(--mut)}
input.pin{text-align:center;letter-spacing:.5em;font-size:24px}
</style>
</head>

const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};

function totals(k){const d=peek(k);let kcal=0,p=0,c=0,f=0,water=0,dk=0,burn=0,min=0;
d.foods.forEach(x=>{kcal+=x.kcal;p+=x.p||0;c+=x.c||0;f+=x.f||0});

return{kcal:kcal+dk,foodKcal:kcal,p,c,f,water,burn,min,sl:sleepMin(d.sleep),hy:HYG.filter(h=>d.hygiene[h[0]]).length}}
function progress(k){const t=totals(k),p=P(),d=peek(k);
const parts=[Math.min(t.water/p.waterGoal,1),Math.min(t.kcal/p.kcalGoal,1),d.workouts.length?1:0,t.sl?1:0,Math.min(t.hy/5,1)];

 if(w[2]==='reps')return Math.round(reps*w[3]);

 h+=`<div class="card c-work"><div class=ch><h3>Exercícios</h3></div><label style="margin-top:0">Descanso entre séries</label><div class=chips style="margin-bottom:8px">${[45,60,90,120].map(s=>`<button class="chip ${gd.restSec===s?'on':''}" data-a=gRestSec data-s=${s}>${s} s</button>`).join('')}</div>${gd.ex.map((x,i)=>`<div class=item data-a=gJump data-i=${i} style="cursor:pointer"><div class=i><b${i===gd.i?' style="color:var(--cc)"':''}>${esc(x.name)}</b><span>${x.log.length}/${x.sets} séries${x.target?' · '+esc(x.target):''}</span></div>${x.log.length>=x.sets?'✅':''}</div>`).join('')}</div><div class=two><button class="btn sec" data-a=gFinish>Finalizar agora</button><button class="btn red" data-a=gCancel>Cancelar</button></div>`;
 return h}

 if(!sets){if(confirm('Nenhuma série registrada. Sair sem salvar?'))endGuided();return}
 const min=Math.max(1,Math.round((Date.now()-g.start)/60000)),kcal=workKcal('musculacao',0,0,min),vol=Math.round(g.ex.reduce((a,x)=>a+x.log.reduce((s,l)=>s+l.load*l.reps,0),0));
 D(g.date).workouts.push({type:'musculacao',label:'Treino guiado · '+g.title,reps:0,km:0,min,kcal,sets,volume:vol});
 db.loads=db.loads||{};g.ex.forEach(x=>{const l=x.log[x.log.length-1];if(l&&l.load>0)db.loads[x.name]={load:l.load,reps:l.reps,date:g.date}});

const km=m=>(m/1000).toFixed(2).replace('.',',');
const hms=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(Math.floor(s%60))}`;
const paceF=(s,m)=>m<50?'--:--':(sp=>`${Math.floor(sp/60)}:${pad(Math.round(sp%60))}`)(s/(m/1000));
const trkTime=()=>trk?(trk.acc+(trk.paused?0:Date.now()-trk.last))/1000:0;
const trkKcal=()=>trk?Math.round(trk.dist/1000*P().weight*0.8):0;
function vWalk(){
let h=`${hero('🚶','Caminhada','Percursos com GPS, distância e ritmo',km(db.routes.filter(r=>r.date===today()).reduce((a,r)=>a+r.dist,0))+' km','hoje · '+db.routes.filter(r=>r.date===today()).length+' percurso(s)',null)}
<div class="card c-map"><div class=ch><h3>🗺️ Caminhada / corrida</h3><button class=add data-a=locate style="background:var(--card2);color:var(--txt)">📍 Minha posição</button></div><div id=map></div>`;
if(!trk)h+=`<button class=btn data-a=trkStart>▶ Iniciar caminhada / corrida</button><div class="sm mut" style="margin-top:8px">Dica: mantenha a tela ligada e o GPS ativo. O navegador pode pausar o rastreio com a tela apagada.</div>`;
else h+=`<div class=big id=t-dist>${km(trk.dist)} km</div><div class=mrow><div><b id=t-time>${hms(trkTime())}</b><span>Tempo</span></div><div><b id=t-pace>${paceF(trkTime(),trk.dist)}</b><span>min/km</span></div><div><b id=t-kcal>${trkKcal()}</b><span>kcal</span></div></div><div class=two><button class="btn sec" data-a=trkPause>${trk.paused?'▶ Retomar':'⏸ Pausar'}</button><button class="btn red" data-a=trkFinish>■ Finalizar</button></div>`;
h+=`</div><div class=card><div class=ch><h3>Histórico de percursos</h3><span class="sm mut">${db.routes.length}</span></div>`;
if(!db.routes.length)h+=`<div class="mut sm">Nenhum percurso salvo ainda.</div>`;
[...db.routes].reverse().slice(0,30).forEach(r=>h+=`<div class=item><div class=i data-a=viewRoute data-id=${r.id} style="cursor:pointer"><b>🏃 ${km(r.dist)} km · ${hms(r.dur)}</b><span>${parseKey(r.date).toLocaleDateString('pt-BR')} · ${r.time} · ritmo ${paceF(r.dur,r.dist)} /km · ~${r.kcal} kcal</span></div><button class=x data-a=delRoute data-id=${r.id}>✕</button></div>`);
const best=db.routes.reduce((a,r)=>r.dist>a?r.dist:a,0);
if(best)h+=`<div class="sm mut" style="margin-top:8px">🏆 Recorde de distância: <b style="color:var(--acc)">${km(best)} km</b></div>`;
h+=`</div>`;return h}
function initMap(){const el=$('#map');if(!el)return;
 if(typeof L==='undefined'){el.innerHTML='<p class=mut style="padding:20px">O mapa precisa de internet para carregar.</p>';return}
 if(map){map.remove();map=null}meMark=null;
 map=L.map(el).setView(MN,4);
 if(!trk&&navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{if(map&&!trk)map.setView([p.coords.latitude,p.coords.longitude],15)},()=>{},{timeout:10000,maximumAge:300000});
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 line=L.polyline([],{color:'#2fd13a',weight:5}).addTo(map);viewLayer=L.layerGroup().addTo(map);
 if(trk&&trk.pts.length){line.setLatLngs(trk.pts.map(p=>[p[0],p[1]]));map.fitBounds(line.getBounds(),{maxZoom:17})}}

/* ---- rastreio GPS ---- */
function startTrk(){if(!navigator.geolocation)return toast('GPS indisponível neste aparelho');
 trk={kind:'caminhada',pts:[],dist:0,start:Date.now(),acc:0,last:Date.now(),paused:false};
 trk.watch=navigator.geolocation.watchPosition(onPos,e=>toast('GPS: '+e.message),{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
 trk.timer=setInterval(updTrk,1000);
 try{navigator.wakeLock?.request('screen').then(l=>trk&&(trk.wake=l)).catch(()=>{})}catch(e){}
 render()}
function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const x=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function onPos(p){if(!trk||trk.paused)return;if(p.coords.accuracy>40)return;
 const pt=[p.coords.latitude,p.coords.longitude,Date.now()],l=trk.pts[trk.pts.length-1];
 if(l){const d=hav(l,pt);if(d<4)return;trk.dist+=d}
 trk.pts.push(pt);
 if(map&&line){line.addLatLng([pt[0],pt[1]]);if(meMark)map.removeLayer(meMark);meMark=L.circleMarker([pt[0],pt[1]],{radius:8,color:'#fff',fillColor:'#2f8cff',fillOpacity:1}).addTo(map);map.setView([pt[0],pt[1]],Math.max(map.getZoom(),16))}
 updTrk()}
function updTrk(){if(!trk)return;const s=trkTime();
 [['t-dist',km(trk.dist)+' km'],['t-time',hms(s)],['t-pace',paceF(s,trk.dist)],['t-kcal',trkKcal()]].forEach(([i,v])=>{const e=document.getElementById(i);if(e)e.textContent=v})}
function pauseTrk(){if(!trk)return;if(trk.paused){trk.paused=false;trk.last=Date.now()}else{trk.acc+=Date.now()-trk.last;trk.paused=true}render()}
function finishTrk(){if(!trk)return;const dur=Math.round(trkTime());navigator.geolocation.clearWatch(trk.watch);clearInterval(trk.timer);try{trk.wake?.release()}catch(e){}
 const t=trk;trk=null;
 if(t.dist<20){toast('Percurso muito curto, descartado');render();return}
 const step=Math.ceil(t.pts.length/1500),pts=t.pts.filter((_,i)=>i%step===0).map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]);
 const kcal=Math.round(t.dist/1000*P().weight*0.8),dt=new Date(t.start),date=dkey(dt),id=Date.now();
 db.routes.push({id,date,time:`${pad(dt.getHours())}:${pad(dt.getMinutes())}`,kind:t.kind,dist:Math.round(t.dist),dur,kcal,pts});
 D(date).workouts.push({type:'caminhada',label:'Caminhada / corrida (GPS)',km:+(t.dist/1000).toFixed(2),min:Math.round(dur/60),kcal,routeId:id});
 save();toast('Percurso salvo!');render()}
function viewRoute(id){const r=db.routes.find(x=>x.id==id);if(!r||!map)return;viewLayer.clearLayers();
 const pl=L.polyline(r.pts,{color:'#ff9f1a',weight:5}).addTo(viewLayer);
 L.circleMarker(r.pts[0],{radius:7,color:'#fff',fillColor:'#2fd13a',fillOpacity:1}).addTo(viewLayer);
 L.circleMarker(r.pts[r.pts.length-1],{radius:7,color:'#fff',fillColor:'#ff4d4d',fillOpacity:1}).addTo(viewLayer);
 map.fitBounds(pl.getBounds(),{padding:[20,20]});window.scrollTo({top:0,behavior:'smooth'})}

 if(goal){const y=H-goal/mx*H;s+=`<line x1=0 x2=${W} y1=${y} y2=${y} stroke="var(--mut)" stroke-dasharray="4 3"/>`}

async function api(path,body,ms=20000){
 if(!API)throw new Error('Servidor do app não configurado.');
 if(navigator.onLine===false)throw new Error('Sem internet no momento.');
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
 try{const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,device:devId}),signal:ctl.signal});
  let j={};try{j=await r.json()}catch(e){throw new Error('O servidor respondeu algo inesperado. Tente de novo mais tarde.')}
  if(!r.ok||j.ok===false){const er=new Error(j.error||('Erro '+r.status));er.status=r.status;er.data=j;throw er}
  return j}
 catch(e){if(e.name==='AbortError')throw new Error('O servidor demorou demais para responder. Tente de novo.');if(e instanceof TypeError)throw new Error('Não consegui falar com o servidor. Verifique a internet.');throw e}
 finally{clearTimeout(tm)}}

 catch(e){if(e.status===401||e.status===403){saveLic(null);render();toast('Sua assinatura Premium não está mais ativa')}}}

async function phTx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('photos',mode),rq=fn(tx.objectStore('photos'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)})}

function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const M=900,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8))};
 im.onerror=()=>rej(new Error('img'));im.src=url})}

  return}
 const d=D(cur),p=P();
 if(t==='quest'){const g=n=>fe[n].value,pr=db.profile;pr.sex=g('sex');pr.age=+g('age')||pr.age;pr.height=+g('height')||pr.height;pr.weight=+g('weight')||pr.weight;pr.biotype=g('biotype');pr.goal=g('goal');pr.level=g('level');pr.local=g('local');pr.dias=+g('dias');pr.restr=g('restr').trim();pr.obs=g('obs').trim();pr.qDone=true;if(+g('weight'))D(today()).weight=+g('weight');save();closeModal();render();toast('Respostas salvas');return}
 if(t==='measures'){const m={date:cur};let any=false;MF.forEach(([k])=>{const v=+fe[k].value;if(v>0){m[k]=v;any=true}});if(!any)return toast('Preencha ao menos uma medida');
  db.measures=(db.measures||[]).filter(x=>x.date!==cur);db.measures.push(m);db.measures.sort((a,b)=>a.date<b.date?-1:1);save();render();toast('Medidas salvas');return}
 if(t==='edit'){const tt=f.dataset.t,it=d[tt][+f.dataset.i];if(!it)return;
  if(tt==='foods'){const ng=+fe.g.value;if(!ng)return;const a=allFoods().find(x=>x[0]===it.name);
   if(a){it.kcal=Math.round(a[1]*ng/100);it.p=+(a[2]*ng/100).toFixed(1);it.c=+(a[3]*ng/100).toFixed(1);it.f=+(a[4]*ng/100).toFixed(1)}
   else{const r=ng/(it.g||ng);it.kcal=Math.round(it.kcal*r);['p','c','f'].forEach(k=>it[k]=+((it[k]||0)*r).toFixed(1))}
   it.g=ng}
  if(tt==='drinks'){const nm=+fe.ml.value;if(!nm)return;const r=nm/(it.ml||nm);it.kcal=Math.round((it.kcal||0)*r);it.ml=nm}
  if(tt==='workouts'){it.reps=+fe.reps.value||0;it.km=+fe.km.value||0;it.min=+fe.min.value||0;it.kcal=workKcal(it.type,it.reps,it.km,it.min)}
  save();closeModal();render();toast('Alterado!');return}
 if(t==='food'){const g=+fe.g.value;if(!g)return;let x;
  if(fe.food.value==='_'){const nm=fe.cname.value.trim(),k100=+fe.ck.value||0,p1=+fe.pk.value||0,c1=+fe.cc.value||0,g1=+fe.gk.value||0;
   x={name:nm||'Alimento',kcal:Math.round(k100*g/100),p:+(p1*g/100).toFixed(1),c:+(c1*g/100).toFixed(1),f:+(g1*g/100).toFixed(1)};
   if(fe.save.value==='1'&&nm){db.profile.myFoods=(db.profile.myFoods||[]).filter(m=>m.name!==nm);db.profile.myFoods.push({name:nm,kcal:k100,p:p1,c:c1,f:g1})}}
  else{const a=allFoods()[fe.food.value];x={name:a[0],kcal:Math.round(a[1]*g/100),p:+(a[2]*g/100).toFixed(1),c:+(a[3]*g/100).toFixed(1),f:+(a[4]*g/100).toFixed(1)}}
  d.foods.push({...x,g,meal:fe.meal.value})}
 if(t==='drink'){const dd=DRINKS.find(x=>x[0]===fe.type.value),ml=(+fe.q.value||0)*(fe.u.value==='L'?1000:1);if(!ml)return;
  const k100=dd[0]==='outra'?(+fe.k100.value||0):dd[2];d.drinks.push({type:dd[0],label:dd[1],ml,kcal:Math.round(k100*ml/100)})}
 if(t==='work'){const w=WORK.find(x=>x[0]===fe.type.value),reps=+fe.reps.value||0,kmv=+fe.km.value||0,min=+fe.min.value||0;if(!reps&&!kmv&&!min)return;
  d.workouts.push({type:w[0],label:w[1],reps,km:kmv,min,kcal:workKcal(w[0],reps,kmv,min)})}
 save();closeModal();render();toast('Salvo!')});

/* ============ AÇÕES ============ */
const A={
setLocal:t=>{db.profile.local=t.dataset.v;save();render()},
tab:t=>{if(tab==='priv'&&t.dataset.v!=='priv')showPriv=false;tab=t.dataset.v;render();window.scrollTo(0,0)},
theme:()=>{db.profile.theme=P().theme==='light'?'dark':'light';save();render()},
setTheme:t=>{db.profile.theme=t.dataset.v;save();render()},
water:()=>{D(cur).drinks.push({type:'agua',label:'Água',ml:250,kcal:0});save();render();toast('+250 ml 💧')},
hoje:()=>{cur=today();render()},
pick:()=>{const i=$('#dp');try{i.showPicker()}catch(e){i.click()}},
goto:t=>{cur=t.dataset.d;tab=t.dataset.v||'food';render();window.scrollTo(0,0)},
addFood:t=>mFood(t.dataset.meal),addDrink:mDrink,qwork:t=>mWork(t.dataset.t),close:closeModal,quest:mQuest,ai:t=>aiAsk(t.dataset.k),
aiLast:t=>{const a=P().ai&&P().ai[t.dataset.k];if(a)aiShow(t.dataset.k,a.txt,a.date)},
goProfile:()=>{closeModal();tab='profile';render();window.scrollTo(0,0)},
paywall:()=>mPaywall(),activate:()=>mActivate(lic&&lic.email),
licCheck:async()=>{await licRefresh(true);render();toast(isPro()?'Premium ativo':'Status atualizado')},
licOut:()=>{if(!confirm('Sair do Premium neste aparelho? Você pode ativar de novo depois com o mesmo e-mail.'))return;api('/release',{token:lic.token}).catch(()=>{});saveLic(null);render()},
testAI:async()=>{const el=$('#aitest');el.textContent='Testando...';const t0=Date.now();
 try{await api('/health',{},15000);el.innerHTML=`<b style="color:var(--acc)">Servidor funcionando</b> (${((Date.now()-t0)/1000).toFixed(1)} s)`}
 catch(e){el.innerHTML=`<b style="color:var(--red)">Falhou:</b> ${esc(e.message)}`}},
priv:()=>{if(showPriv){showPriv=false;render();return}if(P().pin)mPin('enter');else{showPriv=true;render()}},
pinSet:()=>mPin(P().pin?'change':'set'),pinRemove:()=>mPin('remove'),
privDay:t=>{privSel=t.dataset.d;render()},
privMonth:t=>{const[y,m]=privMonth.split('-').map(Number),k=dkey(new Date(y,m-1+(+t.dataset.n),1)).slice(0,7);if(k<=today().slice(0,7)){privMonth=k;render()}},
privAdd:()=>{const v=$('#ptime').value;if(!v)return toast('Informe o horário');const x=D(privSel).intim;if(!x.times){x.times=[];const c=x.had==1?(x.count||1):0;for(let i=0;i<c;i++)x.times.push('--:--')}x.times.push(v);x.times.sort();x.had=1;x.count=x.times.length;save();render();toast('Registrado')},
privDel:t=>{if(!confirm('Remover este registro?'))return;const x=D(privSel).intim;x.times=x.times||[];if(+t.dataset.i>=0)x.times.splice(+t.dataset.i,1);else x.times=[];x.had=x.times.length?1:0;x.count=x.times.length;save();render()},
delw:t=>{if(!confirm('Remover este peso?'))return;D(t.dataset.d).weight=null;save();render()},
delMeasure:t=>{if(!confirm('Remover estas medidas?'))return;db.measures=db.measures.filter(m=>m.date!==t.dataset.d);save();render()},
addPhoto:()=>{if(needPro('fotos'))$('#ph').click()},
viewPhoto:async t=>{try{const p=await phTx('readonly',s=>s.get(+t.dataset.id));if(!p)return;openModal(`<h3>${parseKey(p.date).toLocaleDateString('pt-BR')}</h3><img src="${p.data}" alt="" style="width:100%;border-radius:14px;margin:8px 0"><div class=two><button class="btn sec" data-a=close>Fechar</button><button class="btn red" data-a=delPhoto data-id=${p.id}>Apagar</button></div>`)}catch(e){toast('Não foi possível abrir a foto')}},
delPhoto:async t=>{if(!confirm('Apagar esta foto?'))return;try{await phTx('readwrite',s=>s.delete(+t.dataset.id))}catch(e){}closeModal();loadPhotos()},
qdrink:t=>{const dd=DRINKS.find(x=>x[0]===t.dataset.t),ml=+t.dataset.ml;D(cur).drinks.push({type:dd[0],label:dd[1],ml,kcal:Math.round(dd[2]*ml/100)});save();render();toast('Adicionado!')},
setml:t=>{document.querySelector('[data-n=u][data-v=ml]')?.click();$('#dq').value=t.dataset.v},
pickc:t=>{const f=t.closest('form');f.elements[t.dataset.n].value=t.dataset.v;t.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===t));f.dispatchEvent(new Event('input',{bubbles:true}))},
recent:t=>{const f=t.closest('form');f.querySelector('[data-n=food][data-v="'+t.dataset.i+'"]')?.click();f.elements.g.value=t.dataset.g;f.dispatchEvent(new Event('input',{bubbles:true}))},
copyMeal:t=>{const items=peek(shift(cur,-1)).foods.filter(x=>x.meal===t.dataset.meal);if(!items.length)return;items.forEach(x=>D(cur).foods.push({...x}));save();render();toast('Copiado de ontem')},
edit:t=>mEdit(t.dataset.t,+t.dataset.i),
delMyFood:t=>{if(!confirm('Remover este alimento salvo?'))return;db.profile.myFoods.splice(+t.dataset.i,1);save();render()},
calcMeta:()=>{const c=calcMeta();db.profile.kcalGoal=c.kcal;db.profile.waterGoal=c.water;save();render();toast('Metas atualizadas')},
setv:t=>{const[a,c]=t.dataset.p.split('.'),d=D(cur);d[a]=d[a]||{};d[a][c]=t.dataset.v;save();render()},
del:t=>{if(!confirm('Remover este item?'))return;D(cur)[t.dataset.t].splice(+t.dataset.i,1);save();render()},
hyg:t=>{const h=D(cur).hygiene;h[t.dataset.k]=!h[t.dataset.k];save();render()},
range:t=>{const r=+t.dataset.r;if(r>7&&!needPro('historico'))return;range=r;render()},
trkStart:startTrk,trkPause:pauseTrk,trkFinish:finishTrk,
viewRoute:t=>viewRoute(t.dataset.id),
delRoute:t=>{if(!confirm('Apagar este percurso?'))return;db.routes=db.routes.filter(r=>r.id!=t.dataset.id);Object.values(db.days).forEach(d=>d.workouts=(d.workouts||[]).filter(w=>w.routeId!=t.dataset.id));save();render()},
locate:()=>{if(!navigator.geolocation||!map)return toast('GPS indisponível');navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(meMark)map.removeLayer(meMark);meMark=L.circleMarker(ll,{radius:8,color:'#fff',fillColor:'#2f8cff',fillOpacity:1}).addTo(map);map.setView(ll,16)},e=>toast('GPS: '+e.message),{enableHighAccuracy:true,timeout:15000})},
/* treino guiado */
gStart:()=>{if(needPro('guiado'))startGuided()},gOpen:()=>{tab='guided';render();window.scrollTo(0,0)},
gSet:()=>{const e=gd.ex[gd.i],load=+$('#gk').value||0,reps=+$('#gr').value||0;if(!reps&&!load)return toast('Informe carga ou repetições');
 e.log.push({load,reps});const lastEx=gd.i>=gd.ex.length-1,lastSet=e.log.length>=e.sets;if(!(lastEx&&lastSet))gd.restEnd=Date.now()+gd.restSec*1000;render()},
gRest:t=>{gd.restEnd+=(+t.dataset.s)*1000;render()},gSkipRest:()=>{gd.restEnd=0;render()},
gRestSec:t=>{gd.restSec=+t.dataset.s;render()},
gNext:()=>{if(gd.i<gd.ex.length-1)gd.i++;gd.restEnd=0;render()},
gJump:t=>{gd.i=+t.dataset.i;gd.restEnd=0;render()},
gFinish:finishGuided,
gCancel:()=>{if(confirm('Cancelar o treino guiado? As séries feitas serão descartadas.'))endGuided()},
snooze:()=>{db.profile.bkSnooze=today();save();render()},
export:()=>{db.profile.lastBackup=today();save();const b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`controle-de-vida-${today()}.json`;a.click();toast('Backup exportado');if(tab==='home'||tab==='profile')setTimeout(render,300)},
import:()=>$('#imp').click(),
wipe:()=>{if(confirm('Apagar TODOS os dados? Isso não pode ser desfeito.')&&confirm('Tem certeza mesmo?')){db=DEF();save();phTx('readwrite',s=>s.clear()).catch(()=>{});render()}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t,e)});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.goto){if(el.value&&el.value<=today()){cur=el.value;render()}return}
 const b=el.dataset.bind;if(!b)return;const v=el.type==='number'?(el.value===''?null:+el.value):el.value;
 if(b.startsWith('p.'))db.profile[b.slice(2)]=v;
 else{const[a,c]=b.split('.'),d=D(cur);if(c){d[a]=d[a]||{};d[a][c]=v}else{d[a]=v;if(a==='weight'&&v&&!Object.keys(db.days).some(k=>k>cur&&db.days[k].weight))db.profile.weight=v}}
 save();if(el.dataset.re||b==='p.theme')render()});

$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);
  if(!d||typeof d!=='object'||typeof d.days!=='object'||Array.isArray(d.days))throw 0;
  if(Object.keys(d.days).some(k=>!/^\d{4}-\d{2}-\d{2}$/.test(k)))throw 0;
  if(!confirm('Substituir os dados atuais pelo backup? Uma cópia dos dados atuais será guardada para desfazer.'))return;
  try{localStorage.setItem(KEY+'_antes_import',JSON.stringify(db))}catch(x){}
  const keepTrial=db.profile.trialStart;
  db=Object.assign(DEF(),d);db.profile=db.profile||{};if(keepTrial&&(!db.profile.trialStart||db.profile.trialStart>keepTrial))db.profile.trialStart=keepTrial;
  save();render();toast('Backup importado')}catch(x){toast('Arquivo inválido')}};r.readAsText(f);e.target.value=''});
$('#ph').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const data=await shrink(f);await phTx('readwrite',s=>s.put({id:Date.now(),date:cur,data}));loadPhotos();toast('Foto salva')}catch(x){toast('Não foi possível salvar a foto')}});
function checkDay(){const t=today();if(t!==lastToday){if(cur===lastToday)cur=t;lastToday=t;if(!trk)render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkDay();licRefresh()}});setInterval(checkDay,60000);
window.addEventListener('beforeunload',e=>{if(trk){e.preventDefault();e.returnValue=''}});
if(!db.profile.trialStart){db.profile.trialStart=today();save()}
render();
licRefresh();
(()=>{const q=new URLSearchParams(location.search);if(q.get('a')==='agua'){history.replaceState(null,'',location.pathname);A.water()}else if(q.has('ativar')){history.replaceState(null,'',location.pathname);mActivate(q.get('ativar')||'')}
 else if(q.has('premium')){history.replaceState(null,'',location.pathname);mPaywall()}
 else if(!db.profile.askedQ){db.profile.askedQ=true;save();mQuest()}})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
