<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Meu Controle de Vida</title>
<style>
:root{--bg:#0a0f0d;--card:#121a17;--card2:#18221e;--line:#24332c;--txt:#eef5f0;--mut:#9db0a6;--acc:#8ef04a;--red:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{width:100%;padding:13px;border-radius:12px;border:0;background:var(--acc);color:#0b1a07;font-weight:800;font-size:15px;margin-top:10px}
button.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
button.red{background:var(--red);color:#2a0606}
pre{white-space:pre-wrap;word-break:break-word;background:var(--card2);border-radius:12px;padding:12px;font-size:13px;min-height:60px}
h1{font-size:22px}.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
<h1>🔐 Painel do vendedor</h1>
<div class="card">
 <label>Senha de admin (ADMIN_KEY do Worker)</label>
 <input id="k" type="password" autocomplete="current-password">
 <div class="mut" style="margin-top:6px">Fica guardada só nesta aba e some ao fechar.</div>
</div>
<div class="card">
 <label>E-mail do cliente</label>
 <input id="e" type="email" inputmode="email" autocomplete="off">
 <div class="row">
  <div><label>Plano</label><select id="p"><option value="mensal">Mensal</option><option value="trimestral">Trimestral</option><option value="anual" selected>Anual</option><option value="vitalicio">Vitalício</option></select></div>
  <div><label>Dias (opcional)</label><input id="d" type="number" inputmode="numeric" placeholder="padrão do plano"></div>
 </div>
 <label>Observação (ex: Pix 12/11)</label><input id="n">
 <button data-r="grant">Liberar / renovar Premium</button>
 <div class="row"><button class="sec" data-r="get">Consultar</button><button class="sec" data-r="reset-devices">Zerar aparelhos</button></div>
 <button class="red" data-r="revoke">Bloquear (reembolso)</button>
 <button class="sec" data-r="list">Listar clientes</button>
</div>
<pre id="out">—</pre>
</main>
<script src="config.js"></script>
<script>
var API=(window.MCV||{}).API||'',$=function(i){return document.getElementById(i)};
try{$('k').value=sessionStorage.getItem('mcv_admin')||''}catch(e){}
document.addEventListener('click',async function(ev){var b=ev.target.closest('button[data-r]');if(!b)return;var r=b.dataset.r;
 if(r==='revoke'&&!confirm('Bloquear o Premium de '+$('e').value+'?'))return;
 try{sessionStorage.setItem('mcv_admin',$('k').value)}catch(e){}
 $('out').textContent='...';
 try{var res=await fetch(API+'/admin/'+r,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('k').value},
  body:JSON.stringify({email:$('e').value,plan:$('p').value,days:$('d').value,note:$('n').value})});
  var j=await res.json();
  if(j.rec&&j.rec.exp)j.rec.vence_em=new Date(j.rec.exp).toLocaleString('pt-BR');
  $('out').textContent=JSON.stringify(j,null,2)}
 catch(e){$('out').textContent='Erro: '+e.message}});
</script>
</body>
</html>
