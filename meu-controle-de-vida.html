<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f0d">
<title>Meu Controle de Vida</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0a0f0d;--card:#121a17;--card2:#18221e;--line:#24332c;--txt:#eef5f0;--mut:#8fa399;--acc:#8ef04a;--acc2:#1d4a1f;--red:#ff6b6b;--blue:#4cc9f0;--purple:#a78bfa;--orange:#ffb347}
[data-theme=light]{--bg:#f3f7f4;--card:#fff;--card2:#eaf1ec;--line:#d5e2d9;--txt:#10201a;--mut:#5d7267;--acc:#2f8f2f;--acc2:#d8f0d2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#view{padding:16px 16px 24px;max-width:640px;margin:auto}
h1,h2,h3{margin:0}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:600}
.mut{color:var(--mut)}.sm{font-size:13px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#7be03e,#2d8a2d);display:grid;place-items:center;font-weight:800;color:#06210a}
.top .t{flex:1}.top h2{font-size:19px}
.ibtn{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:20px}
.hero{border-radius:28px;padding:22px;background:linear-gradient(135deg,#1a3a1f 0%,#0f1a14 70%);border:1px solid var(--line);margin:18px 0 26px;color:#eef5f0}
[data-theme=light] .hero{background:linear-gradient(135deg,#c9efc0,#eaf6e6);color:#10201a}
.hero .eyebrow{color:var(--acc)}.hero h2{font-size:26px;margin:6px 0}
.ringrow{display:flex;gap:18px;align-items:center;margin-top:18px}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:26px;font-weight:800}
.ring small{display:block;font-size:9px;font-weight:500;color:var(--mut);letter-spacing:.1em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.stat{padding:16px}
.stat .row{display:flex;justify-content:space-between;align-items:center}
.stat .v{font-size:30px;font-weight:800;color:var(--acc);margin:14px 0 2px}
.stat .v small{font-size:14px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--acc);color:#07210b;font-weight:700;font-size:15px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#2a0606}
.btn.sm2{padding:9px;font-size:13px;margin-top:10px}
.tile{border-radius:22px;padding:16px;min-height:120px;border:1px solid var(--line);text-align:left;color:var(--txt);font-size:inherit}
.tile b{display:block;margin-top:10px;font-size:17px}
.tile span{font-size:13px;color:var(--mut)}
.t1{background:linear-gradient(160deg,#1a3a24,#0f1f16)}.t2{background:linear-gradient(160deg,#2c2150,#171229)}
.t3{background:linear-gradient(160deg,#14334a,#0c1b27)}.t4{background:linear-gradient(160deg,#4a2c1a,#26150c)}
.t5{background:linear-gradient(160deg,#143a3a,#0b2020)}.t6{background:linear-gradient(160deg,#3a3a14,#202008)}
[data-theme=light] .tile{background:var(--card)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--acc)}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dnav .mid{flex:1;text-align:center}.dnav .mid b{display:block;text-transform:capitalize}
.dnav button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:18px}
.dnav input{opacity:0;position:absolute;width:1px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.sum b{display:block;font-size:18px;color:var(--acc)}.sum span{font-size:11px;color:var(--mut)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ch h3{font-size:17px}
.add{border:0;background:var(--acc);color:#07210b;border-radius:12px;padding:8px 14px;font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item .i{flex:1}.item .i b{display:block;font-size:15px}.item .i span{font-size:12px;color:var(--mut)}
.item .x{border:0;background:none;color:var(--red);font-size:18px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px}
.chip.on{background:var(--acc);color:#07210b;border-color:var(--acc);font-weight:700}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:100}
#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;max-width:640px;margin:auto}
#modal .sheet h3{margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
#toast.on{opacity:1}
#map{height:300px;border-radius:18px;overflow:hidden;margin-bottom:12px;background:var(--card2)}
.big{font-size:38px;font-weight:800;color:var(--acc);text-align:center}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.mrow div{background:var(--card2);border-radius:14px;padding:10px;text-align:center}
.mrow b{display:block;font-size:17px}.mrow span{font-size:11px;color:var(--mut)}
.chart{width:100%;height:auto}.chart .lb{fill:var(--mut);font-size:10px}
.plan{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;background:var(--card2)}
.plan.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.plan ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--acc);color:#07210b;font-weight:700;margin-left:6px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;margin-right:.3em}
.ibtn .ic,.dnav .ic,.x .ic,nav .ic,.ring .ic{margin:0}
.ibtn .ic{width:22px;height:22px}.x .ic{width:1em;height:1em}
.stat .row>span:first-child .ic{width:26px;height:26px;margin:0;color:var(--acc)}
.tile .ic{width:28px;height:28px;margin:0;color:var(--acc)}
.hero .ic,h1 .ic{color:var(--acc)}
.add .ic,.btn .ic{margin-right:.35em}
.progbar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}.progbar i{display:block;height:100%;background:var(--acc)}
</style>
</head>

<button data-a="tab" data-v="act"><i>🏃</i>Atividades</button>

</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============ DADOS ============ */
const KEY='mcv_v1';
let db=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return Object.assign({profile:{},days:{},routes:[]},d)}catch(e){}return{profile:{},days:{},routes:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Erro ao salvar!')}}
const P=()=>Object.assign({name:'Meu Controle de Vida',weight:70,height:170,age:25,sex:'M',goal:'manter',level:'iniciante',biotype:'mesomorfo',waterGoal:3000,kcalGoal:2500,sleepGoal:8,theme:'dark'},db.profile);
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey();
const parseKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const shift=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const emptyDay=()=>({foods:[],drinks:[],workouts:[],hygiene:{},sleep:{},intim:{},weight:null});
const D=k=>{if(!db.days[k])db.days[k]=emptyDay();const d=db.days[k];for(const f of['foods','drinks','workouts'])d[f]=d[f]||[];for(const f of['hygiene','sleep','intim'])d[f]=d[f]||{};return d};
const peek=k=>db.days[k]?D(k):emptyDay();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);

['Arroz branco cozido',128,2.5,28,0.2],['Macarrão cozido',158,5.8,31,0.9],['Feijão cozido',76,4.8,14,0.5],

['corrida','Corrida','dist',1.0],['caminhada','Caminhada','dist',0.55],['musculacao','Musculação','time',5],['outro','Outro treino','time',5]];

ectomorfo:{n:'Ectomorfo (magro, ganha massa com dificuldade): foco em força, pouco cardio e muita comida.',d:[

/* ============ CÁLCULOS ============ */
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
function sleepMin(s){const a=toMin(s.start),b=toMin(s.end);if(a==null||b==null)return 0;return(b-a+1440)%1440}
const fmtH=m=>m?`${Math.floor(m/60)}h ${pad(m%60)}min`:'-- h';
const nf=(n,d=0)=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d});
function totals(k){const d=peek(k);let kcal=0,p=0,c=0,f=0,water=0,dk=0,burn=0,min=0;
d.foods.forEach(x=>{kcal+=x.kcal;p+=x.p||0;c+=x.c||0;f+=x.f||0});
d.drinks.forEach(x=>{if(x.type==='agua')water+=x.ml;dk+=x.kcal||0});
d.workouts.forEach(w=>{burn+=w.kcal||0;min+=w.min||0});
return{kcal:kcal+dk,foodKcal:kcal,p,c,f,water,burn,min,sl:sleepMin(d.sleep),hy:HYG.filter(h=>d.hygiene[h[0]]).length}}
function progress(k){const t=totals(k),p=P(),d=peek(k);
const parts=[Math.min(t.water/p.waterGoal,1),Math.min(t.kcal/p.kcalGoal,1),d.workouts.length?1:0,t.sl?1:0,Math.min(t.hy/5,1)];
return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100)}

const EMO_ANY=/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\u25A0-\u25FF\u2B00-\u2BFF]\uFE0F?/gu;
const emoRe=new RegExp('('+Object.keys(EM).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\uFE0F?','g');
function emo(h){const keep=[];
 h=h.replace(/<textarea[\s\S]*?<\/textarea>/g,m=>{keep.push(m);return`\u0000${keep.length-1}\u0000`});
 h=h.replace(/<option[^>]*>[^<]*<\/option>/g,o=>o.replace(/>[^<]*/,t=>t.replace(EMO_ANY,'').replace(/^>\s+/,'>')));
 h=h.replace(emoRe,(m,c)=>svg(EM[c]));
 return h.replace(/\u0000(\d+)\u0000/g,(m,i)=>keep[i])}

/* ---- ATIVIDADES (mapa + guia) ---- */
const km=m=>(m/1000).toFixed(2).replace('.',',');
const hms=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(Math.floor(s%60))}`;
const paceF=(s,m)=>m<50?'--:--':(sp=>`${Math.floor(sp/60)}:${pad(Math.round(sp%60))}`)(s/(m/1000));
const trkTime=()=>trk?(trk.acc+(trk.paused?0:Date.now()-trk.last))/1000:0;
const trkKcal=()=>trk?Math.round(trk.dist/1000*P().weight*(trk.kind==='corrida'?1:0.55)):0;
function vAct(){const p=P(),pl=PLANS[p.biotype],dow=new Date().getDay(),dn=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
let h=`<h1 style="font-size:24px;margin-bottom:4px">Atividades</h1><div class="mut sm" style="margin-bottom:14px">Mapa de Morada Nova – CE e guia de treinos</div>

if(!trk)h+=`<div class=two><select id=kind><option value=corrida>🏃 Corrida</option><option value=caminhada>🚶 Caminhada</option></select><button class=btn data-a=trkStart>▶ Iniciar</button></div><div class="sm mut" style="margin-top:8px">Dica: mantenha a tela ligada e o GPS ativo. O navegador pode pausar o rastreio com a tela apagada.</div>`;
else h+=`<div class=big id=t-dist>${km(trk.dist)} km</div><div class=mrow><div><b id=t-time>${hms(trkTime())}</b><span>Tempo</span></div><div><b id=t-pace>${paceF(trkTime(),trk.dist)}</b><span>min/km</span></div><div><b id=t-kcal>${trkKcal()}</b><span>kcal</span></div></div><div class=two><button class="btn sec" data-a=trkPause>${trk.paused?'▶ Retomar':'⏸ Pausar'}</button><button class="btn red" data-a=trkFinish>■ Finalizar</button></div>`;
h+=`</div><div class=card><div class=ch><h3>Histórico de percursos</h3><span class="sm mut">${db.routes.length}</span></div>`;
if(!db.routes.length)h+=`<div class="mut sm">Nenhum percurso salvo ainda.</div>`;
[...db.routes].reverse().slice(0,30).forEach(r=>h+=`<div class=item><div class=i data-a=viewRoute data-id=${r.id} style="cursor:pointer"><b>${r.kind==='corrida'?'🏃':'🚶'} ${km(r.dist)} km · ${hms(r.dur)}</b><span>${parseKey(r.date).toLocaleDateString('pt-BR')} · ${r.time} · ritmo ${paceF(r.dur,r.dist)} /km · ~${r.kcal} kcal</span></div><button class=x data-a=delRoute data-id=${r.id}>✕</button></div>`);
const best=db.routes.reduce((a,r)=>r.dist>a?r.dist:a,0);
if(best)h+=`<div class="sm mut" style="margin-top:8px">🏆 Recorde de distância: <b style="color:var(--acc)">${km(best)} km</b></div>`;

for(let i=1;i<=7;i++){const d=i%7,pp=pl.d[d];h+=`<div class="plan ${d===dow?'today':''}"><b>${dn[d]} — ${pp[0]}</b>${d===dow?'<span class=tag>HOJE</span>':''}<ul>${pp.slice(1).map(x=>`<li>${x}</li>`).join('')}</ul></div>`}

function initMap(){const el=$('#map');if(!el)return;
 if(typeof L==='undefined'){el.innerHTML='<p class=mut style="padding:20px">O mapa precisa de internet para carregar.</p>';return}
 if(map){map.remove();map=null}
 map=L.map(el).setView(MN,14);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 line=L.polyline([],{color:'#2fd13a',weight:5}).addTo(map);viewLayer=L.layerGroup().addTo(map);
 if(trk&&trk.pts.length){line.setLatLngs(trk.pts.map(p=>[p[0],p[1]]));map.fitBounds(line.getBounds(),{maxZoom:17})}}

/* ---- rastreio GPS ---- */
function startTrk(){if(!navigator.geolocation)return toast('GPS indisponível neste aparelho');
 trk={kind:$('#kind').value,pts:[],dist:0,start:Date.now(),acc:0,last:Date.now(),paused:false};
 trk.watch=navigator.geolocation.watchPosition(onPos,e=>toast('GPS: '+e.message),{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
 trk.timer=setInterval(updTrk,1000);
 try{navigator.wakeLock?.request('screen').then(l=>trk&&(trk.wake=l)).catch(()=>{})}catch(e){}
 render()}
function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const x=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function onPos(p){if(!trk||trk.paused)return;if(p.coords.accuracy>40)return;
 const pt=[p.coords.latitude,p.coords.longitude,Date.now()],l=trk.pts[trk.pts.length-1];
 if(l){const d=hav(l,pt);if(d<4)return;trk.dist+=d}
 trk.pts.push(pt);
 if(map&&line){line.addLatLng([pt[0],pt[1]]);if(meMark)map.removeLayer(meMark);meMark=L.circleMarker([pt[0],pt[1]],{radius:8,color:'#fff',fillColor:'#2f8cff',fillOpacity:1}).addTo(map);map.setView([pt[0],pt[1]],Math.max(map.getZoom(),16))}
 updTrk()}
function updTrk(){if(!trk)return;const s=trkTime();
 [['t-dist',km(trk.dist)+' km'],['t-time',hms(s)],['t-pace',paceF(s,trk.dist)],['t-kcal',trkKcal()]].forEach(([i,v])=>{const e=document.getElementById(i);if(e)e.textContent=v})}
function pauseTrk(){if(!trk)return;if(trk.paused){trk.paused=false;trk.last=Date.now()}else{trk.acc+=Date.now()-trk.last;trk.paused=true}render()}
function finishTrk(){if(!trk)return;const dur=Math.round(trkTime());navigator.geolocation.clearWatch(trk.watch);clearInterval(trk.timer);try{trk.wake?.release()}catch(e){}
 const t=trk;trk=null;
 if(t.dist<20){toast('Percurso muito curto, descartado');render();return}
 const step=Math.ceil(t.pts.length/1500),pts=t.pts.filter((_,i)=>i%step===0).map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]);
 const kcal=Math.round(t.dist/1000*P().weight*(t.kind==='corrida'?1:0.55)),dt=new Date(t.start),date=dkey(dt),id=Date.now();
 db.routes.push({id,date,time:`${pad(dt.getHours())}:${pad(dt.getMinutes())}`,kind:t.kind,dist:Math.round(t.dist),dur,kcal,pts});
 D(date).workouts.push({type:t.kind,label:t.kind==='corrida'?'Corrida (GPS)':'Caminhada (GPS)',km:+(t.dist/1000).toFixed(2),min:Math.round(dur/60),kcal,routeId:id});
 save();toast('Percurso salvo!');render()}
function viewRoute(id){const r=db.routes.find(x=>x.id==id);if(!r||!map)return;viewLayer.clearLayers();
 const pl=L.polyline(r.pts,{color:'#ff9f1a',weight:5}).addTo(viewLayer);
 L.circleMarker(r.pts[0],{radius:7,color:'#fff',fillColor:'#2fd13a',fillOpacity:1}).addTo(viewLayer);
 L.circleMarker(r.pts[r.pts.length-1],{radius:7,color:'#fff',fillColor:'#ff4d4d',fillOpacity:1}).addTo(viewLayer);
 map.fitBounds(pl.getBounds(),{padding:[20,20]});window.scrollTo({top:0,behavior:'smooth'})}

function lastKeys(n){const a=[];for(let i=n-1;i>=0;i--)a.push(shift(today(),-i));return a}
function bars(vals,keys,goal,color){const W=320,H=100,n=vals.length,mx=Math.max(goal||0,...vals,1),bw=W/n;
 let s=`<svg viewBox="0 0 ${W} ${H+16}" class=chart>`;
 vals.forEach((v,i)=>{const hh=v/mx*H;s+=`<rect x="${i*bw+.5}" y="${H-hh}" width="${Math.max(bw-1.5,1)}" height="${Math.max(hh,v?1:2)}" rx="2" fill="${color}" opacity="${v?1:.15}"/>`});
 if(goal){const y=H-goal/mx*H;s+=`<line x1=0 x2=${W} y1=${y} y2=${y} stroke="var(--mut)" stroke-dasharray="4 3"/>`}
 const f=k=>`${k.slice(8)}/${k.slice(5,7)}`;
 return s+`<text x=0 y=${H+13} class=lb>${f(keys[0])}</text><text x=${W} y=${H+13} text-anchor=end class=lb>${f(keys[n-1])}</text></svg>`}
const avg=a=>{const v=a.filter(x=>x>0);return v.length?v.reduce((x,y)=>x+y,0)/v.length:0};
function vData(){const keys=lastKeys(range),p=P(),T=keys.map(totals);
const wts=Object.keys(db.days).sort().map(k=>[k,db.days[k].weight]).filter(x=>x[1]);
const wl=wts[wts.length-1],wf=wts[0];
let h=`<h1 style="font-size:24px;margin-bottom:12px">Dados e evolução</h1><div class=seg>${[7,30,90,365].map(r=>`<button class="chip ${range===r?'on':''}" data-a=range data-r=${r}>${r===365?'Ano':r+' dias'}</button>`).join('')}</div>`;
const sec=(t,vals,goal,color,txt)=>`<div class=card><div class=ch><h3>${t}</h3><span class="sm mut">${txt}</span></div>${bars(vals,keys,goal,color)}</div>`;
h+=sec('💧 Água (ml)',T.map(t=>t.water),p.waterGoal,'var(--blue)',`média ${nf(avg(T.map(t=>t.water)))} ml`);
h+=sec('🔥 Calorias consumidas',T.map(t=>t.kcal),p.kcalGoal,'var(--orange)',`média ${nf(avg(T.map(t=>t.kcal)))} kcal`);
h+=sec('🏃 Calorias gastas',T.map(t=>t.burn),0,'var(--acc)',`total ${nf(T.reduce((a,t)=>a+t.burn,0))} kcal`);
h+=sec('🌙 Sono (horas)',T.map(t=>+(t.sl/60).toFixed(1)),p.sleepGoal,'var(--purple)',`média ${nf(avg(T.map(t=>t.sl))/60,1)} h`);
h+=sec('🚿 Higiene (hábitos/dia)',T.map(t=>t.hy),HYG.length,'var(--blue)',`média ${nf(avg(T.map(t=>t.hy)),1)}`);
const daysTr=T.filter((_,i)=>peek(keys[i]).workouts.length).length;
h+=`<div class=card><div class=ch><h3>📈 Resumo</h3></div><div class="sm" style="line-height:1.9">Dias com treino: <b>${daysTr}</b> de ${range}<br>Dias que bateu a meta de água: <b>${T.filter(t=>t.water>=p.waterGoal).length}</b><br>Distância percorrida (GPS): <b>${km(db.routes.filter(r=>r.date>=keys[0]).reduce((a,r)=>a+r.dist,0))} km</b><br>Refrigerante/energético normal: <b>${keys.reduce((a,k)=>a+peek(k).drinks.filter(x=>x.type==='refri'||x.type==='energ').reduce((s,x)=>s+x.ml,0),0)/1000} L</b> no período${wl?`<br>Peso: <b>${nf(wl[1],1)} kg</b>${wf!==wl?` (${wl[1]-wf[1]>0?'+':''}${nf(wl[1]-wf[1],1)} kg desde ${parseKey(wf[0]).toLocaleDateString('pt-BR')})`:''}`:''}</div></div>`;
if(showPriv){const m=Object.keys(db.days).filter(k=>k.startsWith(today().slice(0,7))&&db.days[k].intim?.had).length;h+=`<div class=card><div class=ch><h3>🔒 Privado</h3></div><div class=sm>Dias no mês atual: <b>${m}</b></div></div>`}
h+=`<div class=card><div class=ch><h3>🔎 Histórico pesquisável</h3></div><input id=q placeholder="Ex.: arroz, flexão, refrigerante..." data-search=1><div id=sres class=sm style="margin-top:8px"></div></div>`;
return h}
function doSearch(q){q=q.trim().toLowerCase();const el=$('#sres');if(!el)return;if(q.length<2){el.innerHTML='';return}
 const out=[];Object.keys(db.days).sort().reverse().forEach(k=>{const d=D(k);
  d.foods.forEach(x=>x.name.toLowerCase().includes(q)&&out.push([k,`🍽️ ${x.name} · ${nf(x.g)} g`]));
  d.drinks.forEach(x=>x.label.toLowerCase().includes(q)&&out.push([k,`🥤 ${x.label} · ${nf(x.ml)} ml`]));
  d.workouts.forEach(x=>x.label.toLowerCase().includes(q)&&out.push([k,`💪 ${x.label}${x.reps?' · '+x.reps+' rep':''}${x.km?' · '+x.km+' km':''}`]))});
 el.innerHTML=out.slice(0,50).map(([k,t])=>`<div class=item data-a=goto data-d=${k} style="cursor:pointer"><div class=i><b>${t}</b><span>${parseKey(k).toLocaleDateString('pt-BR')}</span></div>›</div>`).join('')||'<span class=mut>Nada encontrado.</span>'}

/* ---- PERFIL ---- */
function vProfile(){const p=P(),n=Object.keys(db.days).length;
const f=(l,k,t='number',x='')=>`<div><label>${l}</label><input type=${t} ${t==='number'?'inputmode=decimal step=any':''} data-bind=p.${k} value="${esc(db.profile[k]??p[k])}" ${x}></div>`;
return `<h1 style="font-size:24px;margin-bottom:14px">Perfil</h1>
<div class=card><div class=ch><h3>Sobre você</h3></div>${f('Nome do espaço','name','text')}
<div class=two>${f('Peso (kg)','weight')}${f('Altura (cm)','height')}</div>
<div class=two>${f('Idade','age')}<div><label>Sexo</label><select data-bind=p.sex><option value=M ${p.sex==='M'?'selected':''}>Masculino</option><option value=F ${p.sex==='F'?'selected':''}>Feminino</option></select></div></div>
<div class=two><div><label>Objetivo</label><select data-bind=p.goal>${Object.entries(GOALS).map(([k,v])=>`<option value=${k} ${p.goal===k?'selected':''}>${v}</option>`).join('')}</select></div>
<div><label>Biotipo</label><select data-bind=p.biotype>${Object.keys(PLANS).map(b=>`<option value=${b} ${p.biotype===b?'selected':''}>${b[0].toUpperCase()+b.slice(1)}</option>`).join('')}</select></div></div>
<div class="sm mut" style="margin-top:8px">IMC: <b>${nf(p.weight/((p.height/100)**2),1)}</b></div></div>
<div class=card><div class=ch><h3>Metas diárias</h3></div><div class=two>${f('Água (ml)','waterGoal')}${f('Calorias (kcal)','kcalGoal')}</div>${f('Sono (horas)','sleepGoal')}</div>
<div class=card><div class=ch><h3>Aparência</h3></div><div class=two><button class="btn ${p.theme!=='light'?'':'sec'}" data-a=setTheme data-v=dark>🌙 Escuro</button><button class="btn ${p.theme==='light'?'':'sec'}" data-a=setTheme data-v=light>☀️ Claro</button></div></div>
<div class=card><div class=ch><h3>Backup dos dados</h3></div><div class="sm mut" style="margin-bottom:10px">${n} dia(s) e ${db.routes.length} percurso(s) salvos neste aparelho. Faça backup de tempos em tempos: se limpar os dados do navegador, tudo some.</div>
<div class=two><button class=btn data-a=export>⬇ Exportar</button><button class="btn sec" data-a=import>⬆ Importar</button></div>
<button class="btn red sm2" data-a=wipe>Apagar tudo</button></div>`}

/* ============ MODAIS ============ */
const sel=(n,opts,x='')=>`<select name=${n} ${x}>${opts}</select>`;
function mFood(){openModal(`<form data-form=food><h3>Adicionar alimento</h3>
<label>Refeição</label>${sel('meal',MEALS.map((m,i)=>`<option ${i==([0,1,2,3,4,5][(()=>{const h=new Date().getHours();return h<10?0:h<15?1:h<18?2:3})()])?'selected':''}>${m}</option>`).join(''))}
<label>Alimento</label>${sel('food',FOODS.map((f,i)=>`<option value=${i}>${f[0]}</option>`).join('')+'<option value=_>Outro (manual)</option>')}
<div id=custom hidden class=two><div><label>Nome</label><input name=cname></div><div><label>kcal por 100 g</label><input name=ck type=number inputmode=decimal step=any></div></div>
<label>Quantidade (gramas)</label><input name=g type=number inputmode=decimal step=any required autofocus>
<div id=prev class="sm mut" style="margin:10px 0">—</div><button class=btn>Salvar</button></form>`)}
function mDrink(){openModal(`<form data-form=drink><h3>Adicionar bebida</h3>
<label>Bebida</label>${sel('type',DRINKS.map(d=>`<option value=${d[0]}>${d[1]}</option>`).join(''))}
<div class=two><div><label>Quantidade</label><input name=q type=number inputmode=decimal step=any required id=dq></div><div><label>Unidade</label>${sel('u','<option value=ml>ml</option><option value=L>litros</option>')}</div></div>
<div class=chips style="margin-top:10px">${[200,250,300,350,500,600,1000].map(v=>`<button type=button class=chip data-a=setml data-v=${v}>${v>=1000?'1 L':v+' ml'}</button>`).join('')}</div>
<div id=ck hidden><label>kcal por 100 ml (opcional)</label><input name=k100 type=number inputmode=decimal step=any></div>
<button class=btn style="margin-top:14px">Salvar</button></form>`)}
function mWork(){openModal(`<form data-form=work><h3>Adicionar exercício</h3>
<label>Exercício</label>${sel('type',WORK.map(w=>`<option value=${w[0]}>${w[1]}</option>`).join(''))}
<label>Repetições (flexões, abdominais, agachamentos, barra)</label><input name=reps type=number inputmode=numeric>
<div class=two><div><label>Distância (km)</label><input name=km type=number inputmode=decimal step=any></div><div><label>Duração (min)</label><input name=min type=number inputmode=decimal step=any></div></div>
<div class="sm mut" style="margin-top:8px">Preencha o que se aplica. As calorias são estimadas pelo seu peso.</div><button class=btn style="margin-top:14px">Salvar</button></form>`)}

document.addEventListener('input',e=>{const f=e.target.closest('form[data-form=food]');
 if(f){const v=f.food.value,c=$('#custom');c.hidden=v!=='_';const g=+f.g.value||0;let k;
  if(v==='_')k=(+f.ck.value||0)*g/100;else{const x=FOODS[v];k=x[1]*g/100;$('#prev').textContent=g?`${nf(k)} kcal · P ${nf(x[2]*g/100,1)}g · C ${nf(x[3]*g/100,1)}g · G ${nf(x[4]*g/100,1)}g`:'—';return}
  $('#prev').textContent=g?`${nf(k)} kcal`:'—'}
 const dr=e.target.closest('form[data-form=drink]');if(dr)$('#ck').hidden=dr.type.value!=='outra';
 if(e.target.dataset.search)doSearch(e.target.value)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const d=D(cur),p=P(),t=f.dataset.form;
 if(t==='food'){const g=+f.g.value;if(!g)return;let x;
  if(f.food.value==='_'){x={name:f.cname.value||'Alimento',kcal:Math.round((+f.ck.value||0)*g/100),p:0,c:0,f:0}}
  else{const a=FOODS[f.food.value];x={name:a[0],kcal:Math.round(a[1]*g/100),p:+(a[2]*g/100).toFixed(1),c:+(a[3]*g/100).toFixed(1),f:+(a[4]*g/100).toFixed(1)}}
  d.foods.push({...x,g,meal:f.meal.value})}
 if(t==='drink'){const dd=DRINKS.find(x=>x[0]===f.type.value),ml=(+f.q.value||0)*(f.u.value==='L'?1000:1);if(!ml)return;
  const k100=dd[0]==='outra'?(+f.k100.value||0):dd[2];d.drinks.push({type:dd[0],label:dd[1],ml,kcal:Math.round(k100*ml/100)})}
 if(t==='work'){const w=WORK.find(x=>x[0]===f.type.value),reps=+f.reps.value||0,kmv=+f.km.value||0,min=+f.min.value||0;if(!reps&&!kmv&&!min)return;let kc=0;
  if(w[2]==='reps')kc=reps*w[3];else if(w[2]==='dist')kc=kmv?kmv*p.weight*w[3]:(w[0]==='corrida'?9.8:3.5)*p.weight*min/60;else kc=w[3]*p.weight*min/60;
  d.workouts.push({type:w[0],label:w[1],reps,km:kmv,min,kcal:Math.round(kc)})}
 save();closeModal();render();toast('Salvo!')});

/* ============ AÇÕES ============ */
const A={
tab:t=>{tab=t.dataset.v;render();window.scrollTo(0,0)},
theme:()=>{db.profile.theme=P().theme==='light'?'dark':'light';save();render()},
setTheme:t=>{db.profile.theme=t.dataset.v;save();render()},
water:()=>{D(today()).drinks.push({type:'agua',label:'Água',ml:250,kcal:0});save();render();toast('+250 ml 💧')},
prev:()=>{cur=shift(cur,-1);render()},next:()=>{if(cur<today()){cur=shift(cur,1);render()}},hoje:()=>{cur=today();render()},
pick:()=>{const i=$('#dp');try{i.showPicker()}catch(e){i.click()}},
goto:t=>{cur=t.dataset.d;tab='diary';render();window.scrollTo(0,0)},
addFood:mFood,addDrink:mDrink,addWork:mWork,
setml:t=>{const q=$('#dq'),u=document.querySelector('[name=u]');u.value='ml';q.value=t.dataset.v},
del:t=>{if(!confirm('Remover este item?'))return;D(cur)[t.dataset.t].splice(+t.dataset.i,1);save();render()},
hyg:t=>{const h=D(cur).hygiene;h[t.dataset.k]=!h[t.dataset.k];save();render()},
priv:()=>{showPriv=!showPriv;render()},
range:t=>{range=+t.dataset.r;render()},
trkStart:startTrk,trkPause:pauseTrk,trkFinish:finishTrk,
viewRoute:t=>viewRoute(t.dataset.id),
delRoute:t=>{if(!confirm('Apagar este percurso?'))return;db.routes=db.routes.filter(r=>r.id!=t.dataset.id);Object.values(db.days).forEach(d=>d.workouts=(d.workouts||[]).filter(w=>w.routeId!=t.dataset.id));save();render()},
locate:()=>{if(!navigator.geolocation||!map)return toast('GPS indisponível');navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(meMark)map.removeLayer(meMark);meMark=L.circleMarker(ll,{radius:8,color:'#fff',fillColor:'#2f8cff',fillOpacity:1}).addTo(map);map.setView(ll,16)},e=>toast('GPS: '+e.message),{enableHighAccuracy:true,timeout:15000})},
export:()=>{const b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`controle-de-vida-${today()}.json`;a.click();toast('Backup exportado')},
import:()=>$('#imp').click(),
wipe:()=>{if(confirm('Apagar TODOS os dados? Isso não pode ser desfeito.')&&confirm('Tem certeza mesmo?')){db={profile:{},days:{},routes:[]};save();render()}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t,e)});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.goto){if(el.value&&el.value<=today()){cur=el.value;render()}return}
 const b=el.dataset.bind;if(!b)return;const v=el.type==='number'?(el.value===''?null:+el.value):el.value;
 if(b.startsWith('p.'))db.profile[b.slice(2)]=v;
 else{const[a,c]=b.split('.'),d=D(cur);if(c){d[a]=d[a]||{};d[a][c]=v}else{d[a]=v;if(a==='weight'&&v)db.profile.weight=v}}
 save();if(el.dataset.re||b==='p.theme')render()});
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.days)throw 0;if(confirm('Substituir os dados atuais pelo backup?')){db=Object.assign({profile:{},days:{},routes:[]},d);save();render();toast('Backup importado')}}catch(x){toast('Arquivo inválido')}};r.readAsText(f);e.target.value=''});
function checkDay(){const t=today();if(t!==lastToday){if(cur===lastToday)cur=t;lastToday=t;if(!trk)render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay()});setInterval(checkDay,60000);
window.addEventListener('beforeunload',e=>{if(trk){e.preventDefault();e.returnValue=''}});
$('#tabs').innerHTML=emo($('#tabs').innerHTML);
render();
</script>
</body>
</html>
